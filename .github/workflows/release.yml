name: Release & Deploy to WordPress.org

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Serialize with update-readme-assets.yml: both touch the same WordPress.org SVN
# repo, so they must never run at once (a concurrent deploy + asset update races
# on trunk). Shared group name => the second run queues until the first finishes.
concurrency:
  group: wporg-svn-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ZIP & deploy to WordPress.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The translation template (languages/gatecha-captcha.pot) is committed to
      # the repo and shipped as-is — it is NOT regenerated here. make-pot rewrites
      # the POT-Creation-Date header on every run, which makes SVN trunk's .pot
      # differ from the repo and trips the update-readme-assets guard. Regenerate
      # it manually with wp-cli i18n make-pot when translatable strings change.

      - name: Build plugin ZIP
        run: |
          mkdir -p build/gatecha-captcha
          rsync -a ./ build/gatecha-captcha/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.wordpress-org' \
            --exclude='.qodo' \
            --exclude='.claude' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.distignore' \
            --exclude='CLAUDE.md' \
            --exclude='build'
          cd build && zip -rq ../gatecha-captcha-${GITHUB_REF_NAME}.zip gatecha-captcha

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: gatecha-captcha-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: gatecha-captcha
          ASSETS_DIR: .wordpress-org
