name: Build Plugin ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP
        run: |
          zip -r gatecha-captcha-${GITHUB_REF_NAME}.zip gatecha-captcha

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: gatecha-captcha-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
