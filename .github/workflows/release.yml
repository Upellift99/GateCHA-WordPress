name: Build Plugin ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Generate translation template (.pot)
        run: |
          curl -sL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o wp-cli.phar
          php wp-cli.phar i18n make-pot gatecha-captcha gatecha-captcha/languages/gatecha-captcha.pot \
            --domain=gatecha-captcha \
            --exclude=assets,node_modules
          rm wp-cli.phar

      - name: Create ZIP
        run: |
          zip -r gatecha-captcha-${GITHUB_REF_NAME}.zip gatecha-captcha

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: gatecha-captcha-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
